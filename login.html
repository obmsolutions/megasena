<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mega Sena Power Tool Pro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h1 {
            color: #0066cc;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0055aa;
        }
        .error-message {
            color: #d32f2f;
            margin-top: 15px;
            font-size: 14px;
        }
        .admin-link {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .admin-link a {
            color: #0066cc;
            text-decoration: none;
        }
        .admin-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Mega Sena Power Tool Pro</h1>
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" placeholder="Digite seu usuário">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha">
        </div>
        <button onclick="login()">Entrar</button>
        <div id="errorMessage" class="error-message"></div>
        <div class="admin-link">
            <a href="#" onclick="showAdminLogin()">Acesso Administrativo</a>
        </div>
    </div>

    <script>
        // Verifica se há usuários cadastrados no localStorage
        if (!localStorage.getItem('users')) {
            // Cria um usuário admin padrão se não existir
            const defaultUsers = {
                'admin': {
                    password: 'admin123',
                    isAdmin: true,
                    expirationDays: 0 // 0 = nunca expira
                }
            };
            localStorage.setItem('users', JSON.stringify(defaultUsers));
        }

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (!username || !password) {
                errorMessage.textContent = 'Por favor, preencha todos os campos.';
                return;
            }

            const users = JSON.parse(localStorage.getItem('users'));
            
            if (!users[username] || users[username].password !== password) {
                errorMessage.textContent = 'Usuário ou senha incorretos.';
                return;
            }

            // Verifica se a senha expirou
            const user = users[username];
            if (user.expirationDate && new Date(user.expirationDate) < new Date()) {
                errorMessage.textContent = 'Sua senha expirou. Entre em contato com o administrador.';
                return;
            }

            // Login bem-sucedido
            sessionStorage.setItem('loggedInUser', username);
            window.location.href = 'index.html';
        }

        function showAdminLogin() {
            const username = prompt('Digite o usuário administrador:');
            if (!username) return;
            
            const password = prompt('Digite a senha administrador:');
            if (!password) return;

            const users = JSON.parse(localStorage.getItem('users'));
            
            if (!users[username] || users[username].password !== password || !users[username].isAdmin) {
                alert('Acesso negado. Credenciais administrativas inválidas.');
                return;
            }

            // Login admin bem-sucedido - redireciona para o gerenciamento
            sessionStorage.setItem('adminLoggedIn', 'true');
            window.location.href = 'user-management.html';
        }
    </script>
</body>
</html>
