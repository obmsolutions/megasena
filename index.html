<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OBM Mega Analytics v2.1</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-badge">6 de 60</div>
        <p class="eyebrow">OBM Solutions</p>
        <h1>OBM Mega Analytics <span>v2.1</span></h1>
        <p class="login-copy">Acesse sua plataforma de análise, conferência e geração de carteiras.</p>
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" placeholder="Digite seu usuário">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="Digite sua senha">
        </div>
        <button onclick="login()">Entrar no sistema</button>
        <div id="errorMessage" class="error-message"></div>
        <div class="admin-link">
            <a href="#" onclick="showAdminLogin()">Acesso Administrativo</a>
        </div>
    </div>

    <script src="assets/js/login.js"></script>
</body>
</html>
